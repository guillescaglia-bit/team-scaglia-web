<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOOD · Selector (prototipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#40584A; --green-2:#354a3e; --green-3:#28382e;
    --cream:#EDE4D3; --paper:#f5f2ea; --card:#ffffff;
    --ink:#2d322b; --muted:#8b8f83; --line:#e2ddce;
    --gold:#b79a5e;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Montserrat',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;padding:40px 20px;min-height:100vh}
  .shell{max-width:980px;margin:0 auto}
  .eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--green);font-weight:600;margin-bottom:10px}
  .h{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1;color:var(--ink);margin-bottom:6px}
  .h em{font-style:italic;color:var(--green)}
  .sub{font-size:13px;color:var(--muted);margin-bottom:34px;letter-spacing:.02em}

  .stage{display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start}

  /* ── Torre / selector de piso ── */
  .tower{position:relative;background:var(--green);border-radius:16px;padding:12px;box-shadow:0 24px 60px -30px rgba(40,56,46,.7)}
  .tower-top{font-family:var(--sans);font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:rgba(237,228,211,.6);text-align:center;padding:10px 0 12px}
  .floors{position:relative}
  .fslide{position:absolute;left:6px;right:6px;height:var(--fh,44px);top:0;background:var(--cream);border-radius:10px;transition:transform .5s cubic-bezier(.65,.02,.22,1);z-index:0;box-shadow:0 8px 20px -8px rgba(0,0,0,.35)}
  .frow{position:relative;z-index:1;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;cursor:pointer;border-radius:10px;transition:opacity .3s}
  .frow .fn{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--cream);transition:color .4s}
  .frow .fmeta{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(237,228,211,.55);transition:color .4s}
  .frow.on .fn{color:var(--green-3)}
  .frow.on .fmeta{color:var(--green)}
  .frow:not(.on):hover{opacity:.82}
  .tower-base{margin-top:8px;border-top:1px solid rgba(237,228,211,.18);padding:12px 14px 6px;text-align:center}
  .tower-base b{color:var(--cream);font-family:var(--serif);font-size:15px;font-weight:600}
  .tower-base span{display:block;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(237,228,211,.5);margin-top:2px}

  /* ── Panel derecho ── */
  .panel{min-height:440px}
  .units-lbl{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px}
  .units-lbl b{color:var(--green)}
  .units{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:26px}
  .unit{position:relative;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 10px 13px;text-align:center;cursor:pointer;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s,background .35s;opacity:0;transform:translateY(14px)}
  .unit.in{opacity:1;transform:translateY(0)}
  .unit .ul{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1;color:var(--ink);transition:color .3s}
  .unit .ut{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px;min-height:11px}
  .unit .ust{font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:9px}
  .unit.disp .ust{color:var(--green)}
  .unit.disp:hover{transform:translateY(-4px);box-shadow:0 18px 34px -18px rgba(40,56,46,.55);border-color:var(--green)}
  .unit.disp.sel{background:var(--green);border-color:var(--green)}
  .unit.disp.sel .ul{color:var(--cream)}
  .unit.disp.sel .ut{color:rgba(237,228,211,.7)}
  .unit.disp.sel .ust{color:var(--cream)}
  .unit.dot::after{content:'';position:absolute;top:11px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--green)}
  .unit.sold,.unit.no{cursor:default;background:#f3f0e8}
  .unit.sold .ul,.unit.no .ul{color:#c3c0b4}
  .unit.sold .ust{color:#b8442f;opacity:.7}
  .unit.no .ust{color:var(--muted)}

  /* ── Precio ── */
  .price-wrap{position:relative;min-height:250px}
  .ph{background:var(--card);border:1px dashed var(--line);border-radius:16px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:30px;gap:8px}
  .ph svg{width:40px;height:40px;stroke:var(--line);fill:none;stroke-width:1.4}
  .ph b{font-family:var(--serif);font-size:22px;color:var(--ink);font-weight:600}
  .card-price{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 28px;box-shadow:0 26px 60px -34px rgba(40,56,46,.5);opacity:0;transform:translateY(18px);transition:opacity .5s,transform .55s cubic-bezier(.2,.8,.2,1)}
  .card-price.in{opacity:1;transform:translateY(0)}
  .cp-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}
  .cp-unit{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1;color:var(--green)}
  .cp-tipo{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .cp-m2{text-align:right;font-size:12px;color:var(--ink);line-height:1.5}
  .cp-m2 span{color:var(--muted);font-size:10.5px}
  .cp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .cp-grid.one{grid-template-columns:1fr}
  .pb{border:1px solid var(--line);border-radius:12px;padding:15px 16px}
  .pb.fin{background:var(--green);border-color:var(--green)}
  .pb-l{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);margin-bottom:8px}
  .pb.fin .pb-l{color:rgba(237,228,211,.72)}
  .pb-v{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
  .pb.fin .pb-v{color:var(--cream)}
  .pb-rows{margin-top:12px;border-top:1px solid rgba(237,228,211,.22);padding-top:10px}
  .pb-row{display:flex;justify-content:space-between;font-size:11.5px;color:rgba(237,228,211,.82);padding:3px 0}
  .pb-row b{color:var(--cream);font-weight:600}
  .pb-note{font-size:9.5px;color:var(--muted);margin-top:10px;line-height:1.5}
  .pb.cash .pb-note{color:var(--muted)}
  .cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:18px;background:var(--ink);color:var(--cream);border:none;border-radius:11px;padding:14px;font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .3s}
  .cta:hover{background:var(--green-3)}

  @media(max-width:760px){
    body{padding:26px 16px}
    .h{font-size:34px}
    .stage{grid-template-columns:1fr;gap:20px}
    .tower{display:flex;flex-direction:column}
    .floors{display:flex;flex-wrap:wrap;gap:6px}
    .fslide{display:none}
    .frow{flex:0 0 auto;width:auto;height:38px;padding:0 14px;background:rgba(237,228,211,.08)}
    .frow.on{background:var(--cream)}
    .frow .fmeta{display:none}
    .units{grid-template-columns:repeat(4,1fr);gap:7px}
    .unit .ul{font-size:22px}
    .cp-grid{grid-template-columns:1fr}
  }
</style></head>
<body>
<div class="shell">
  <div class="eyebrow">Disponibilidad</div>
  <div class="h">Elegí <em>piso</em> y <em>unidad</em></div>
  <div class="sub">Tocá un piso y después la unidad para ver su precio, tipología y financiación.</div>

  <div class="stage">
    <div class="tower">
      <div class="tower-top">WOOD · Larrea 1180</div>
      <div class="floors" id="floors"><div class="fslide" id="fslide"></div></div>
      <div class="tower-base"><b>Local comercial</b><span>a la calle · consultar</span></div>
    </div>

    <div class="panel">
      <div class="units-lbl" id="ulbl">Unidades del piso <b id="ulblP">—</b></div>
      <div class="units" id="units"></div>
      <div class="price-wrap" id="pricew">
        <div class="ph"><svg viewBox="0 0 24 24"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/></svg><b>Elegí una unidad</b><span style="font-size:12px">Tocá una unidad disponible para ver el precio</span></div>
      </div>
    </div>
  </div>
</div>

<script>
var FLOORS = [
  {p:'9°', us:[{u:'A',s:'no'},{u:'B',s:'no'},{u:'C',s:'no'}]},
  {p:'8°', us:[{u:'A',s:'no'},{u:'B',s:'no'},{u:'C',s:'no'}]},
  {p:'7°', us:[{u:'A',fin:123336,cash:117169},{u:'B',fin:146484,cash:139160},{u:'C',fin:182988,cash:173839}]},
  {p:'6°', us:[{u:'A',s:'v'},{u:'B',s:'v'},{u:'C',fin:177905,cash:170281}]},
  {p:'5°', us:[{u:'A',s:'v'},{u:'B',s:'v'},{u:'C',s:'v'},{u:'D',fin:87686,cash:83818}]},
  {p:'4°', us:[{u:'A',s:'v'},{u:'B',cash:117000},{u:'C',fin:89661,cash:85586},{u:'D',fin:85107,cash:81239}]},
  {p:'3°', us:[{u:'A',s:'v'},{u:'B',s:'v'},{u:'C',fin:86944,cash:82597},{u:'D',fin:82528,cash:78402}]},
  {p:'2°', us:[{u:'A',s:'v'},{u:'B',fin:118400,cash:105422},{u:'C',fin:84227,cash:74718},{u:'D',s:'v'}]},
  {p:'1°', us:[{u:'A',fin:95928,cash:85650},{u:'B',fin:103572,cash:92475},{u:'C',fin:185000,cash:175750}]}
];
var fmtU = function(n){ return 'U$S ' + Math.round(n).toLocaleString('es-AR'); };
var disp = function(x){ return x.fin != null || x.cash != null; };
var tipoLabel = function(pn,u){ if(u==='A'||u==='B')return 'Monoambiente'; if(u==='D')return 'Estudio'; if(u==='C')return (pn===1||pn>=6)?'2 ambientes':'Estudio'; return ''; };
var planInfo = function(pn,u){
  if(u==='A')return {tipo:'Monoambiente',cub:'30,17',tot:'34,26'};
  if(u==='B')return pn<=5?{tipo:'Monoambiente',cub:'32,90',tot:'36,99'}:{tipo:'Monoambiente',cub:'36,60',tot:'40,69'};
  if(u==='C'){ if(pn===1)return {tipo:'2 Ambientes',cub:'54,58',tot:'107,68',terraza:true}; return pn<=5?{tipo:'Estudio profesional',cub:'27,17',tot:'27,17'}:{tipo:'2 Ambientes',cub:'45,80',tot:'50,83'}; }
  if(u==='D')return {tipo:'Estudio profesional',cub:'25,79',tot:'25,79'};
  return null;
};
var nDisp = function(f){ return f.us.filter(disp).length; };

var floorsEl = document.getElementById('floors');
var slide = document.getElementById('fslide');
var FH = 44;
var curFloor = -1;

FLOORS.forEach(function(f, fi){
  var nd = nDisp(f);
  var meta = nd ? nd + ' disp.' : 'sin disp.';
  var row = document.createElement('div');
  row.className = 'frow'; row.setAttribute('data-fi', fi);
  row.innerHTML = '<span class="fn">'+f.p+'</span><span class="fmeta">'+meta+'</span>';
  row.addEventListener('click', function(){ selFloor(fi); });
  floorsEl.appendChild(row);
});

function selFloor(fi){
  if(fi===curFloor) return;
  curFloor = fi;
  var rows = floorsEl.querySelectorAll('.frow');
  rows.forEach(function(r,i){ r.classList.toggle('on', i===fi); });
  slide.style.transform = 'translateY(' + (fi*FH) + 'px)';
  renderUnits(fi);
  // limpiar precio con fade
  var pw = document.getElementById('pricew');
  pw.innerHTML = '<div class="ph"><svg viewBox="0 0 24 24"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/></svg><b>Elegí una unidad</b><span style="font-size:12px">Tocá una unidad disponible de este piso</span></div>';
}

function renderUnits(fi){
  var f = FLOORS[fi], pn = parseInt(f.p,10);
  document.getElementById('ulblP').textContent = f.p;
  var host = document.getElementById('units');
  host.innerHTML = '';
  for(var i=0;i<4;i++){
    var x = f.us[i];
    var el = document.createElement('div');
    if(!x){ el.className='unit'; el.style.visibility='hidden'; host.appendChild(el); continue; }
    var tl = tipoLabel(pn, x.u);
    var st, cls;
    if(disp(x)){ cls='unit disp dot'; st='Disponible'; el.setAttribute('data-i', i); el.addEventListener('click', (function(ii){return function(){ selUnit(fi,ii,this); };})(i)); }
    else if(x.s==='v'){ cls='unit sold'; st='Vendido'; }
    else { cls='unit no'; st='No disp.'; }
    el.className = cls;
    el.innerHTML = '<div class="ul">'+x.u+'</div><div class="ut">'+tl+'</div><div class="ust">'+st+'</div>';
    host.appendChild(el);
    (function(node,idx){ setTimeout(function(){ node.classList.add('in'); }, 60 + idx*70); })(el, i);
  }
}

function countUp(node, target){
  var dur=680, t0=null;
  function step(ts){ if(!t0)t0=ts; var p=Math.min(1,(ts-t0)/dur); var e=1-Math.pow(1-p,3); node.textContent = fmtU(target*e); if(p<1) requestAnimationFrame(step); else node.textContent=fmtU(target); }
  requestAnimationFrame(step);
}

function selUnit(fi, ui, node){
  var host = document.getElementById('units');
  host.querySelectorAll('.unit').forEach(function(u){ u.classList.remove('sel'); });
  if(node) node.classList.add('sel');
  var f = FLOORS[fi], x = f.us[ui], pn = parseInt(f.p,10);
  var pi = planInfo(pn, x.u);
  var m2 = pi ? (pi.cub===pi.tot ? pi.tot+' m²' : pi.cub+' m² cub.<br><span>'+pi.tot+' m² tot.'+(pi.terraza?' · terraza':'')+'</span>') : '';
  var blocks = '';
  var cols = (x.cash!=null && x.fin!=null) ? '' : ' one';
  if(x.cash!=null){
    blocks += '<div class="pb cash"><div class="pb-l">Cash · 100% adelantado</div><div class="pb-v" data-v="'+x.cash+'">U$S 0</div>'+
      (x.fin==null?'<div class="pb-note">Se comercializa únicamente al contado.</div>':'')+'</div>';
  }
  if(x.fin!=null){
    var ade=Math.round(x.fin*0.30), cuo=Math.round(x.fin*0.70/24);
    blocks += '<div class="pb fin"><div class="pb-l">Financiado · 30% + 24 cuotas</div><div class="pb-v" data-v="'+x.fin+'">U$S 0</div>'+
      '<div class="pb-rows"><div class="pb-row"><span>Adelanto (30%)</span><b>'+fmtU(ade)+'</b></div><div class="pb-row"><span>24 cuotas de</span><b>'+fmtU(cuo)+'</b></div></div></div>';
  }
  var html = '<div class="card-price"><div class="cp-top"><div><div class="cp-unit">'+f.p+' · '+x.u+'</div><div class="cp-tipo">'+(pi?pi.tipo:tipoLabel(pn,x.u))+'</div></div><div class="cp-m2">'+m2+'</div></div>'+
    '<div class="cp-grid'+cols+'">'+blocks+'</div>'+
    '<button class="cta">Consultar esta unidad por WhatsApp</button></div>';
  var pw = document.getElementById('pricew');
  pw.innerHTML = html;
  var card = pw.querySelector('.card-price');
  requestAnimationFrame(function(){ card.classList.add('in'); });
  setTimeout(function(){ pw.querySelectorAll('.pb-v').forEach(function(v){ countUp(v, parseInt(v.getAttribute('data-v'),10)); }); }, 220);
}

// arranca en el 7° (primer piso con disponibles desde arriba)
selFloor(2);
</script>
</body></html>
