name: Keep-alive Supabase

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive
        run: |
          echo "Tocando la web para mantener Supabase activo..."
          CODE=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "https://www.teamscaglia.com/api/keepalive")
          echo "Respuesta HTTP: $CODE"
