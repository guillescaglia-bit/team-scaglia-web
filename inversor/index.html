<style>
  :root{
    --navy:#253C64; --green:#15925a; --danger:#dc2626;
    --card:#ffffff; --page:#f4f5f7; --tx:#1b2540; --muted:#6b7280; --bd:#e7e9f0; --track:#eef0f5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',sans-serif;background:var(--page);color:var(--tx);-webkit-font-smoothing:antialiased;min-height:100vh}
  .oculto{display:none!important}
  .container{max-width:900px;margin:0 auto;padding:20px}
  body.wide .container{max-width:1320px}

  /* Header */
  header{background:var(--navy);color:#fff;padding:16px 0}
  header .container{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .brand{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.75}
  .hi{font-size:19px;font-weight:600;margin-top:3px}
  .hbtns{display:flex;align-items:center;gap:16px}
  .hbtn{background:none;border:none;color:#fff;font-size:12px;font-weight:500;cursor:pointer;opacity:.85}
  .hbtn:hover{opacity:1}

  /* Login */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{background:var(--card);border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:36px 32px;width:100%;max-width:400px;text-align:center}
  .login-box .lbrand{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--navy);opacity:.7;margin-bottom:6px}
  .login-box h1{font-size:26px;font-weight:600;color:var(--navy);margin-bottom:6px}
  .login-box .sub{font-size:13px;color:var(--muted);margin-bottom:24px}
  label{display:block;text-align:left;font-size:12px;font-weight:600;color:var(--tx);margin-bottom:6px}
  input{width:100%;padding:12px 14px;border:2px solid var(--bd);border-radius:8px;font-family:inherit;font-size:14px;margin-bottom:14px}
  input:focus{outline:none;border-color:var(--navy)}
  .btn{width:100%;padding:12px;border:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s}
  .btn:hover{opacity:.9}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-sec{background:#eef0f5;color:var(--tx)}
  .btn-sm{padding:7px 12px;font-size:12px;width:auto}
  .btn-danger{background:var(--danger);color:#fff}
  .err{color:var(--danger);font-size:12px;text-align:left;margin:-8px 0 12px;display:none}
  .linkline{font-size:12px;color:var(--muted);margin-top:14px}
  .linkline button{background:none;border:none;color:var(--navy);font-weight:600;cursor:pointer;text-decoration:underline;font-size:12px}

  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
  .kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}

  .kpi-val{font-size:19px;font-weight:700;margin-top:6px}
  .kpi-sub{font-size:12px;margin-top:2px}

  .empty{text-align:center;color:var(--muted);padding:40px 20px}

<script>
const SUPABASE_URL = 'https://fgipdqcxsbmrjvozalqn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnaXBkcWN4c2Jtcmp2b3phbHFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMzM2NzIsImV4cCI6MjA5NzkwOTY3Mn0.YjDJBcuzwp0_f3U976eGBtyVia1Uw01cjJbaSV3VlE0';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const ADMIN_EMAIL = 'info@teamscaglia.com';
const esAdmin = (e) => (e || '').trim().toLowerCase() === ADMIN_EMAIL;

let usuario = null; // { email, rol }

// ── Helpers ──
const $ = (id) => document.getElementById(id);
const fmtUSD = (n) => (n == null || isNaN(n)) ? '—' : 'US$ ' + Number(n).toLocaleString('es-AR', { maximumFractionDigits: 0 });
const fmtFecha = (f) => { if (!f) return '—'; const p = f.split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : f; };
function diasDe(inv) {
  if (!inv.fecha) return null;
  const hasta = estadoDe(inv) === 'vendida' ? new Date(inv.fecha_venta || inv.creado_en) : new Date();
  return Math.max(0, Math.round((hasta - new Date(inv.fecha)) / 86400000));
}
const estadoDe = (inv) => (inv.precio_venta != null && inv.precio_venta !== '') ? 'vendida' : 'cartera';
// Los montos guardados (pagado / mercado / venta) son el TOTAL de la propiedad.
// La titularidad (%) define la PARTE que le corresponde al inversor.
const cuota = (inv) => ((inv.titularidad == null || inv.titularidad === '') ? 100 : Number(inv.titularidad)) / 100;
const refTotal = (inv) => { const v = estadoDe(inv) === 'vendida' ? inv.precio_venta : inv.precio_mercado; return (v == null || v === '') ? null : Number(v); };
const pagadoInv = (inv) => (inv.pagado == null || inv.pagado === '') ? null : Number(inv.pagado) * cuota(inv);
const valorInv = (inv) => { const v = refTotal(inv); return v == null ? null : v * cuota(inv); };
function resultadoDe(inv) { const p = pagadoInv(inv), v = valorInv(inv); return (p == null || v == null) ? null : v - p; }
function pctDe(inv) { const r = resultadoDe(inv), p = pagadoInv(inv); return (r == null || !p) ? null : (r / p) * 100; }
const fmtPct = (p) => p == null ? '—' : (p >= 0 ? '+' : '') + p.toFixed(0) + '%';
// Etiqueta de condición de la operación: A = declarada, B = no declarada (uso interno del admin)
const condTag = (c) => { const v = (c === 'B') ? 'B' : 'A'; const decl = v === 'A'; return `<span class="tag" style="background:${decl ? 'rgba(21,146,90,.15)' : 'rgba(180,120,10,.18)'};color:${decl ? 'var(--green)' : '#9a6a00'}" title="${decl ? 'Declarada' : 'No declarada'}">${v}</span>`; };

let _valuaciones = [];
async function cargarValuaciones() {
  const { data } = await supa.from('valuaciones').select('*').order('fecha', { ascending: true });
  _valuaciones = data || [];
}

// Puntos de la línea de tiempo del valor REAL de una propiedad (la PARTE del inversor)
function timelinePropiedad(inv) {
  const c = cuota(inv);
  const pts = [];
  if (inv.fecha && inv.pagado != null && inv.pagado !== '') pts.push({ t: new Date(inv.fecha), v: Number(inv.pagado) * c });
  _valuaciones.filter(x => x.inversion_id === inv.id && !x.proyectado).forEach(x => pts.push({ t: new Date(x.fecha), v: Number(x.valor) * c }));
  const ref = refTotal(inv);
  if (ref != null) {
    const fref = estadoDe(inv) === 'vendida' ? new Date(inv.fecha_venta || inv.creado_en) : new Date();
    fref.setHours(0, 0, 0, 0);
    if (!pts.some(p => Math.abs(p.t - fref) < 43200000)) pts.push({ t: fref, v: ref * c });
  }
  pts.sort((a, b) => a.t - b.t);
  return pts;
}

// Puntos de PROYECCIÓN a futuro (línea punteada). Arranca en el último valor real para conectar.
function timelineProyeccion(inv) {
  const c = cuota(inv);
  const proy = _valuaciones.filter(x => x.inversion_id === inv.id && x.proyectado)
    .map(x => ({ t: new Date(x.fecha), v: Number(x.valor) * c }))
    .sort((a, b) => a.t - b.t);
  if (!proy.length) return [];
  const real = timelinePropiedad(inv);
  const ancla = real.length ? real[real.length - 1] : null;
  return ancla ? [ancla, ...proy] : proy;
}

// Valor total de la cartera del inversor en el tiempo (suma de las propiedades que TIENE en cada momento).
// - En la fecha en que COMPRA una propiedad (aporte de capital) → escalón hacia ARRIBA.
// - En la fecha en que VENDE una propiedad → esa plata sale del portfolio → escalón hacia ABAJO.
function timelineGlobal(invs) {
  const series = invs.map(inv => {
    const pts = timelinePropiedad(inv);
    let saleT = null;
    if (estadoDe(inv) === 'vendida') { const d = new Date(inv.fecha_venta || inv.creado_en); d.setHours(0, 0, 0, 0); saleT = d.getTime(); }
    return { start: pts.length ? pts[0].t.getTime() : null, saleT, pts };
  }).filter(s => s.start != null);
  // valor de una propiedad en el momento t: 0 antes de comprarla y 0 después de venderla
  const valAt = (s, t) => {
    if (t < s.start) return 0;
    if (s.saleT != null && t > s.saleT) return 0;
    let v = 0; for (const p of s.pts) { if (p.t.getTime() <= t) v = p.v; else break; } return v;
  };
  const allT = [...new Set(series.flatMap(s => s.pts.map(p => p.t.getTime())))].sort((a, b) => a - b);
  const out = [];
  allT.forEach(t => {
    // Compra (aporte): punto "justo antes" contando solo lo que YA tenías → escalón hacia arriba
    if (series.some(s => s.start === t) && out.length) {
      const pre = series.reduce((sum, s) => sum + (s.start < t ? valAt(s, t) : 0), 0);
      out.push({ t: new Date(t), v: pre });
    }
    const total = series.reduce((sum, s) => sum + valAt(s, t), 0);
    out.push({ t: new Date(t), v: total });
    // Venta: punto "justo después" sin la propiedad vendida → escalón hacia abajo
    if (series.some(s => s.saleT === t)) {
      const totalDespues = series.reduce((sum, s) => sum + (s.saleT === t ? 0 : valAt(s, t)), 0);
      out.push({ t: new Date(t), v: totalDespues });
    }
  });
  return out;
}

// ── Gráficos con Chart.js (eje X por fechas reales, tooltips al pasar el mouse) ──
let _chartSeq = 0, _pendingCharts = [];
const _charts = {};

// Devuelve el HTML (un <canvas>) y encola el gráfico para dibujarlo con flushCharts()
function chartHTML(points, opts) {
  opts = opts || {};
  if (!points || points.length < 2) return '<p class="muted" style="font-size:12px;margin:8px 0">Cargá más de un valor en el historial para ver la evolución.</p>';
  const id = 'chart_' + (++_chartSeq);
  _pendingCharts.push({ id, points: points.slice(), tension: opts.tension != null ? opts.tension : 0.4, proj: (opts.proj || []).slice() });
  return `<div style="position:relative;height:${opts.height || 220}px;margin-top:8px"><canvas id="${id}"></canvas></div>`;
}

// Dibuja (o redibuja) todos los canvas que se agregaron al DOM
function flushCharts() {
  if (!window.Chart) { _pendingCharts = []; return; }
  const fmtAxis = v => (Math.abs(v) >= 1000 ? '$' + Math.round(v / 1000) + 'k' : '$' + Math.round(v));
  _pendingCharts.forEach(({ id, points, tension, proj }) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (_charts[id]) { _charts[id].destroy(); delete _charts[id]; }
    const tens = tension != null ? tension : 0.4;
    const datasets = [{
      data: points.map(p => ({ x: p.t.getTime(), y: p.v })),
      borderColor: '#15925a', backgroundColor: 'rgba(21,146,90,.10)',
      borderWidth: 2, fill: true, tension: tens,
      pointRadius: 3, pointHoverRadius: 6, pointBackgroundColor: '#15925a'
    }];
    if (proj && proj.length >= 2) {
      datasets.push({
        data: proj.map(p => ({ x: p.t.getTime(), y: p.v })),
        borderColor: '#9ca3af', borderDash: [6, 5], backgroundColor: 'rgba(0,0,0,0)',
        borderWidth: 2, fill: false, tension: tens,
        pointRadius: proj.map((p, i) => i === 0 ? 0 : 3),      // oculto el punto ancla (se pisa con el real)
        pointHoverRadius: proj.map((p, i) => i === 0 ? 0 : 6),
        pointBackgroundColor: '#9ca3af'
      });
    }
    _charts[id] = new Chart(el, {
      type: 'line',
      data: { datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { intersect: false, mode: 'index' },
        plugins: {
          legend: { display: false },
          tooltip: {
            padding: 10, displayColors: false,
            callbacks: {
              title: items => fmtFecha(new Date(items[0].parsed.x).toISOString().slice(0, 10)),
              label: item => (item.datasetIndex === 1 ? 'Proyectado: ' : 'Valor: ') + fmtUSD(item.parsed.y)
            }
          }
        },
        scales: {
          x: { type: 'linear',
               ticks: { maxTicksLimit: 5, color: '#94a3b8', font: { size: 10 }, maxRotation: 0,
                        callback: v => fmtFecha(new Date(v).toISOString().slice(0, 10)) },
               grid: { display: false } },
          y: { ticks: { maxTicksLimit: 5, color: '#94a3b8', font: { size: 10 }, callback: fmtAxis },
               grid: { color: 'rgba(0,0,0,.05)' } }
        }
      }
    });
  });
  _pendingCharts = [];
}

function showErr(id, msg) { const e = $(id); e.textContent = msg; e.style.display = 'block'; }
function clearErr(id) { const e = $(id); e.style.display = 'none'; }
function appAlert(msg, tipo) {
  $('appAlert').innerHTML = `<div class="alert alert-${tipo === 'error' ? 'err' : 'ok'}">${msg}</div>`;
  setTimeout(() => { $('appAlert').innerHTML = ''; }, 4000);
}

// ── Login ──
async function continuar() {
  const email = $('inEmail').value.trim();
  clearErr('errEmail');
  if (!/^\S+@\S+\.\S+$/.test(email)) { showErr('errEmail', 'Ingresá un email válido.'); return; }
  if (esAdmin(email)) {
    $('pasoEmail').classList.add('oculto');
    $('pasoPass').classList.remove('oculto');
    $('inPass').focus();
    return;
  }
  const btn = $('btnContinuar'); btn.disabled = true; btn.textContent = 'Verificando...';
  const { data: existe, error } = await supa.rpc('inversor_existe', { p_email: email });
  if (error) { btn.disabled = false; btn.textContent = 'Continuar'; showErr('errEmail', 'No se pudo verificar. Probá de nuevo.'); return; }
  if (!existe) { btn.disabled = false; btn.textContent = 'Continuar'; showErr('errEmail', 'Este email no tiene inversiones registradas.'); return; }
  btn.textContent = 'Enviando...';
  const { error: e2 } = await supa.auth.signInWithOtp({ email });
  btn.disabled = false; btn.textContent = 'Continuar';
  if (e2) { showErr('errEmail', 'No se pudo enviar el código. Probá de nuevo.'); return; }
  $('emailShow').textContent = email;
  $('pasoEmail').classList.add('oculto');
  $('pasoCodigo').classList.remove('oculto');
  $('inCodigo').focus();
  cooldown(60);
}

async function verificarCodigo() {
  const email = $('inEmail').value.trim();
  const token = $('inCodigo').value.trim();
  clearErr('errCodigo');
  if (token.length < 6) { showErr('errCodigo', 'Ingresá el código de 6 dígitos.'); return; }
  const { error } = await supa.auth.verifyOtp({ email, token, type: 'email' });
  if (error) { showErr('errCodigo', 'Código incorrecto o vencido.'); return; }
  usuario = { email, rol: 'inversor' };
  entrar();
}

async function loginPass() {
  const email = $('inEmail').value.trim();
  const password = $('inPass').value;
  clearErr('errPass');
  if (!password) { showErr('errPass', 'Ingresá tu contraseña.'); return; }
  const { error } = await supa.auth.signInWithPassword({ email, password });
  if (error) { showErr('errPass', 'Contraseña incorrecta.'); return; }
  usuario = { email, rol: 'admin' };
  entrar();
}

async function reenviar() {
  const email = $('inEmail').value.trim();
  const { error } = await supa.auth.signInWithOtp({ email });
  if (!error) cooldown(60);
}
let _t = null;
function cooldown(s) {
  const b = $('btnReenviar'); if (!b) return;
  if (_t) clearInterval(_t);
  b.disabled = true; b.style.opacity = '.55';
  b.textContent = `Reenviar en ${s}s`;
  _t = setInterval(() => { s--; if (s <= 0) { clearInterval(_t); b.disabled = false; b.style.opacity = '1'; b.textContent = 'Reenviar código'; } else b.textContent = `Reenviar en ${s}s`; }, 1000);
}

function volverEmail() {
  $('pasoCodigo').classList.add('oculto');
  $('pasoPass').classList.add('oculto');
  $('pasoEmail').classList.remove('oculto');
  $('inCodigo').value = ''; $('inPass').value = '';
}

async function salir() {
  if (!confirm('¿Seguro que querés salir?')) return;
  try { await supa.auth.signOut(); } catch (e) {}
  usuario = null;
  location.reload();
}

function entrar() {
  $('vistaLogin').classList.add('oculto');
  $('vistaApp').classList.remove('oculto');
  if (usuario.rol === 'admin') {
    $('saludo').textContent = 'Panel de administración';
    $('panelAdmin').classList.remove('oculto');
    $('dashInversor').classList.add('oculto');
    document.body.classList.add('wide');
    cargarAdmin();
  } else {
    $('dashInversor').classList.remove('oculto');
    $('panelAdmin').classList.add('oculto');
    document.body.classList.remove('wide');
    supa.rpc('registrar_acceso_inversor').then(() => {}, () => {}); // último acceso + contador
    cargarDashboard();
  }
}

// ── Dashboard del inversor ──
async function cargarDashboard() {
  const { data, error } = await supa.from('inversiones').select('*').order('fecha', { ascending: false });
  if (error) { $('dashInversor').innerHTML = '<div class="empty">No se pudieron cargar tus inversiones.</div>'; console.error(error); return; }
  await cargarValuaciones();
  renderDashboard(data || []);
}

function renderDashboard(invs) {
  const nombre = (invs[0]?.inversor_nombre || '').split(' ')[0] || 'Hola';
  $('saludo').textContent = `Hola, ${nombre} 👋`;
  if (!invs.length) { $('dashInversor').innerHTML = '<div class="empty">Todavía no hay inversiones cargadas a tu nombre.</div>'; return; }
  _invsInversor = invs;

  const cartera = invs.filter(i => estadoDe(i) === 'cartera');
  const vendidas = invs.filter(i => estadoDe(i) === 'vendida');
  const totalInvertido = invs.reduce((a, i) => a + (pagadoInv(i) || 0), 0);
  const valorHoy = cartera.reduce((a, i) => a + (valorInv(i) || 0), 0);
  const ganProy = cartera.reduce((a, i) => a + (resultadoDe(i) || 0), 0);
  const ganReal = vendidas.reduce((a, i) => a + (resultadoDe(i) || 0), 0);
  const invCartera = cartera.reduce((a, i) => a + (pagadoInv(i) || 0), 0);
  const invVend = vendidas.reduce((a, i) => a + (pagadoInv(i) || 0), 0);
  const importeCobrado = vendidas.reduce((a, i) => a + (valorInv(i) || 0), 0); // lo que cobraste por las ventas (tu parte)

  // Cada card: resumen + info + su gráfico de evolución adentro
  const cards = invs.map(inv => {
    const est = estadoDe(inv);
    const res = resultadoDe(inv);
    const dias = diasDe(inv);
    return `
      <div class="card prop">
        <div class="prop-head">
          <div class="prop-name">${inv.propiedad}</div>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
            <span class="tag ${est === 'vendida' ? 'tag-sold' : 'tag-hold'}">${est === 'vendida' ? 'Vendida' : 'En cartera'}</span>
            ${condTag(inv.condicion)}
          </div>
        </div>
        <div class="prop-grid">
          <div><span>Titularidad</span><b>${inv.titularidad != null ? inv.titularidad + '%' : '—'}</b></div>
          <div><span>Fecha</span><b>${fmtFecha(inv.fecha)}</b></div>
          <div><span>Pagaste</span><b>${fmtUSD(pagadoInv(inv))}</b></div>
          <div><span>${est === 'vendida' ? 'Vendida en' : 'Vale hoy'} (tu parte)</span><b>${fmtUSD(valorInv(inv))}</b></div>
          <div><span>Resultado</span><b class="${res >= 0 ? 'green' : ''}">${res == null ? '—' : (res >= 0 ? '+' : '') + fmtUSD(res)}</b></div>
          <div><span>Ganancia</span><b class="${(pctDe(inv) || 0) >= 0 ? 'green' : ''}">${fmtPct(pctDe(inv))}</b></div>
        </div>
        <div class="prop-foot">${cuota(inv) < 1 && refTotal(inv) != null ? `Propiedad completa: ${fmtUSD(refTotal(inv))} · tu ${inv.titularidad}% · ` : ''}${dias != null ? dias + ' días' : ''}${inv.tc ? ' · TC compra ' + Number(inv.tc).toLocaleString('es-AR') : ''}</div>
        <button class="btn btn-sec btn-sm" style="width:100%;margin-top:14px" onclick="verDetalleInversion('${inv.id}')">Ver más detalles →</button>
      </div>`;
  }).join('');

  // Gráfico global: valor total de toda la cartera del inversor en el tiempo
  const gpts = timelineGlobal(invs);
  const globalChart = gpts.length > 1 ? `
    <div class="card">
      <div class="card-title">📊 Evolución total de tus inversiones</div>
      ${chartHTML(gpts, { tension: 0 })}
      <p class="muted" style="font-size:11px;margin:8px 0 0">Los saltos verticales son aportes de capital (cuando sumás una propiedad nueva).</p>
    </div>` : '';

  const banner = (usuario && usuario.rol === 'admin') ?
    `<div class="alert alert-ok" style="background:#eef2fb;color:var(--navy);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
       <span>👁 Estás viendo como <b>${invs[0].inversor_nombre || ''}</b> (así lo ve el inversor)</span>
       <button class="btn btn-sec btn-sm" onclick="volverPanel()">← Volver al panel</button>
     </div>` : '';

  $('dashInversor').innerHTML = `
    ${banner}
    <div class="kpis">
      <div class="kpi">${invVend ? `<div class="kpi-label">Neto invertido</div><div class="kpi-val">${fmtUSD(invCartera)}</div><div class="kpi-sub muted">Total invertido: ${fmtUSD(totalInvertido)}</div>` : `<div class="kpi-label">Total invertido</div><div class="kpi-val">${fmtUSD(totalInvertido)}</div><div class="kpi-sub muted">Volumen invertido</div>`}</div>
      <div class="kpi"><div class="kpi-label">Valor de mercado hoy</div><div class="kpi-val">${fmtUSD(valorHoy)}</div><div class="kpi-sub muted">En cartera</div></div>
      <div class="kpi"><div class="kpi-label">Ganancia proyectada</div><div class="kpi-val green">+${fmtUSD(ganProy)}</div><div class="kpi-sub green">${invCartera ? fmtPct(ganProy / invCartera * 100) : '—'}</div></div>
      <div class="kpi"><div class="kpi-label">Importe cobrado</div><div class="kpi-val">${fmtUSD(importeCobrado)}</div><div class="kpi-sub green">${invVend ? '+' + fmtUSD(ganReal) + ' · ' + fmtPct(ganReal / invVend * 100) + ' · ventas' : 'sin ventas aún'}</div></div>
    </div>
    <div class="props">${cards}</div>
    ${globalChart}`;
  flushCharts();
}

// ── Panel admin ──
async function cargarAdmin() {
  const { data, error } = await supa.from('inversiones').select('*').order('creado_en', { ascending: false });
  if (error) { $('panelAdmin').innerHTML = `<div class="empty">Error al cargar: ${error.message || 'desconocido'}<br><span style="font-size:12px">(Si dice "schema cache", corré <b>NOTIFY pgrst, 'reload schema';</b> en Supabase.)</span></div>`; console.error(error); return; }

  await cargarAccesos();

// Accesos de los inversores (cuántas veces entró + último acceso)
let _accesos = {};
async function cargarAccesos() {
  const { data } = await supa.from('accesos_inversor').select('*');
  _accesos = {};
  (data || []).forEach(a => { _accesos[(a.email || '').toLowerCase()] = a; });
}

let _inversiones = [];
let _qAdmin = '';
let _vistaAdmin = 'inversor';
let _sortCol = null, _sortDir = 1; // 1 = menor a mayor, -1 = mayor a menor
const normTxt = (s) => (s == null ? '' : '' + s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

// C\u00f3mo se ordena cada columna de la tabla "Por inversor"
const SORT_EXTRACT = {
  inversor: i => (i.inversor_nombre || '').toLowerCase(),
  propiedad: i => (i.propiedad || '').toLowerCase(),
  pct: i => (i.titularidad == null || i.titularidad === '') ? 100 : Number(i.titularidad),
  fecha: i => i.fecha || '',
  pagado: i => (i.pagado == null || i.pagado === '') ? -Infinity : Number(i.pagado),
  mercado: i => (i.precio_mercado == null || i.precio_mercado === '') ? -Infinity : Number(i.precio_mercado),
  venta: i => (i.precio_venta == null || i.precio_venta === '') ? -Infinity : Number(i.precio_venta),
  ganancia: i => { const p = pctDe(i); return p == null ? -Infinity : p; },
  estado: i => estadoDe(i),
  condicion: i => (i.condicion || 'A')
};

function ordenarInvs(list) {
  if (!_sortCol || !SORT_EXTRACT[_sortCol]) return list;
  const ex = SORT_EXTRACT[_sortCol];
  return [...list].sort((a, b) => {
    const va = ex(a), vb = ex(b);
    if (va < vb) return -_sortDir;
    if (va > vb) return _sortDir;
    return 0;
  });
}

function setSortAdmin(col) {
  if (_sortCol === col) _sortDir = -_sortDir; else { _sortCol = col; _sortDir = 1; }
  pintarAdmin();
}

// Lista filtrada (por buscador) + ordenada (por columna), para la tabla "Por inversor"
function listaInversorAdmin() {
  const toks = normTxt(_qAdmin).split(/\s+/).filter(Boolean);
  const filtrada = _inversiones.filter(inv => {
    const hay = normTxt([inv.inversor_nombre, inv.propiedad, inv.inversor_email, inv.titularidad, estadoDe(inv) === 'vendida' ? 'vendida' : 'cartera', inv.condicion === 'B' ? 'condicion b no declarada' : 'condicion a declarada'].join(' '));
    return toks.every(t => hay.includes(t));
  });
  return ordenarInvs(filtrada);
}

function thSort(col, label) {
  const flecha = _sortCol === col ? (_sortDir === 1 ? ' \u25b2' : ' \u25bc') : '';
  return `<th onclick="setSortAdmin('${col}')" style="cursor:pointer;user-select:none;white-space:nowrap">${label}<span style="color:var(--navy)">${flecha}</span></th>`;
}

function theadAdmin() {
  return `<tr>${thSort('inversor', 'Inversor')}${thSort('propiedad', 'Propiedad')}${thSort('pct', '%')}${thSort('fecha', 'Fecha')}${thSort('pagado', 'Pagado (total)')}${thSort('mercado', 'Mercado (total)')}${thSort('venta', 'Venta (total)')}${thSort('ganancia', 'Ganancia')}${thSort('estado', 'Estado')}${thSort('condicion', 'Cond.')}<th>Acciones</th></tr>`;
}

function filasAdmin(list) {
  if (!list.length) return `<tr><td colspan="11" class="empty">${_qAdmin ? 'No hay resultados para “' + _qAdmin + '”.' : 'Todavía no hay inversiones. Agregá la primera.'}</td></tr>`;
  return list.map(inv => `
    <tr>
      <td>${inv.inversor_nombre}</td>
      <td>${inv.propiedad}</td>
      <td>${inv.titularidad != null ? inv.titularidad + '%' : '100%'}</td>
      <td>${fmtFecha(inv.fecha)}</td>
      <td>${fmtUSD(inv.pagado)}</td>
      <td>${fmtUSD(inv.precio_mercado)}</td>
      <td>${fmtUSD(inv.precio_venta)}</td>
      <td class="${(resultadoDe(inv) || 0) >= 0 ? 'green' : ''}">${resultadoDe(inv) == null ? '—' : fmtPct(pctDe(inv))}</td>
      <td><span class="tag ${estadoDe(inv) === 'vendida' ? 'tag-sold' : 'tag-hold'}">${estadoDe(inv) === 'vendida' ? 'Vendida' : 'Cartera'}</span></td>
      <td>${condTag(inv.condicion)}</td>
      <td><div class="actions">
        <button class="btn btn-sec btn-sm" onclick="verComoInversor('${inv.inversor_email}', '${(inv.inversor_nombre || '').replace(/'/g, "\\'")}')">Ver</button>
        <button class="btn btn-sec btn-sm" onclick="abrirForm('${inv.id}')">Editar</button>
        <button class="btn btn-danger btn-sm" onclick="borrar('${inv.id}')">Borrar</button>
      </div></td>
    </tr>`).join('');
}

function aplicarFiltroAdmin() {
  const el = $('qAdmin');
  _qAdmin = el ? el.value : '';
  if (_vistaAdmin === 'propiedad') {
    const g = propGroupsFiltradas();
    if ($('propWrap')) $('propWrap').innerHTML = tarjetasPropiedad(g);
    if ($('propCount')) $('propCount').textContent = g.length;
    return;
  }
  if (_vistaAdmin === 'clientes') {
    const l = clientesFiltrados();
    if ($('cliBody')) $('cliBody').innerHTML = filasClientes(l);
    if ($('cliCount')) $('cliCount').textContent = l.length;
    return;
  }
  const list = listaInversorAdmin();
  if ($('admBody')) $('admBody').innerHTML = filasAdmin(list);
  if ($('admCount')) $('admCount').textContent = list.length;
}

// ── Vista "Clientes": un cliente por email, con sus accesos ──
const fmtFechaHora = (t) => {
  if (!t) return 'Nunca entró';
  const d = new Date(t);
  return d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
};

function clientesConAccesos() {
  const map = new Map();
  _inversiones.forEach(i => {
    const email = (i.inversor_email || '').trim();
    if (!email || email.toLowerCase() === 'pendiente@teamscaglia.com') return;
    const k = email.toLowerCase();
    if (!map.has(k)) map.set(k, { nombre: i.inversor_nombre || '', email, invs: 0 });
    map.get(k).invs++;
  });
  return [...map.values()].map(c => {
    const a = _accesos[c.email.toLowerCase()] || {};
    return { ...c, accesos: a.accesos || 0, ultimo: a.ultimo_acceso || null };
  }).sort((a, b) => (b.ultimo ? new Date(b.ultimo).getTime() : 0) - (a.ultimo ? new Date(a.ultimo).getTime() : 0));
}

function clientesFiltrados() {
  const toks = normTxt(_qAdmin).split(/\s+/).filter(Boolean);
  if (!toks.length) return clientesConAccesos();
  return clientesConAccesos().filter(c => {
    const hay = normTxt(c.nombre + ' ' + c.email);
    return toks.every(t => hay.includes(t));
  });
}

function filasClientes(list) {
  if (!list.length) return `<tr><td colspan="5" class="empty">${_qAdmin ? 'No hay clientes para “' + _qAdmin + '”.' : 'Todavía no hay clientes.'}</td></tr>`;
  return list.map(c => `
    <tr>
      <td>${c.nombre || '—'}</td>
      <td>${c.email}</td>
      <td>${c.invs}</td>
      <td><b>${c.accesos}</b></td>
      <td class="${c.ultimo ? '' : 'muted'}">${fmtFechaHora(c.ultimo)}</td>
    </tr>`).join('');
}

function renderAdmin(invs) {
  _inversiones = invs;
  pintarAdmin();
}

function setVistaAdmin(v) { _vistaAdmin = v; pintarAdmin(); }

function toggleVistaHTML() {
  return `<div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn btn-sm ${_vistaAdmin === 'inversor' ? 'btn-primary' : 'btn-sec'}" onclick="setVistaAdmin('inversor')">Por inversor</button>
    <button class="btn btn-sm ${_vistaAdmin === 'propiedad' ? 'btn-primary' : 'btn-sec'}" onclick="setVistaAdmin('propiedad')">Por propiedad</button>
    <button class="btn btn-sm ${_vistaAdmin === 'clientes' ? 'btn-primary' : 'btn-sec'}" onclick="setVistaAdmin('clientes')">Clientes</button>
  </div>`;
}

// Accesos de mails que entraron pero NO están asignados a ninguna inversión (mail sin enlazar)
function accesosHuerfanos() {
  const emails = new Set(clientesConAccesos().map(c => c.email.toLowerCase()));
  return Object.values(_accesos)
    .filter(a => { const e = (a.email || '').toLowerCase(); return e && !esAdmin(e) && !emails.has(e); })
    .sort((a, b) => new Date(b.ultimo_acceso || 0) - new Date(a.ultimo_acceso || 0));
}

function pintarAdmin() {
  const qEsc = _qAdmin.replace(/"/g, '&quot;');
  if (_vistaAdmin === 'clientes') {
    const huerfanos = accesosHuerfanos();
    const cardHuerfanos = huerfanos.length ? `<div class="card">
        <div class="card-title" style="color:var(--danger);margin-bottom:6px">⚠ Entraron pero su mail no está en ninguna inversión (${huerfanos.length})</div>
        <p class="muted" style="font-size:12px;margin:0 0 10px">Estas personas ingresaron al portal pero su mail todavía no está asignado a una inversión. Asignáselo (en “Por inversor” → Editar → Email) para enlazarlo.</p>
        ${huerfanos.map(a => `<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--bd)"><span>${a.email}</span><span class="muted">${a.accesos} acceso(s) · ${fmtFechaHora(a.ultimo_acceso)}</span></div>`).join('')}
      </div>` : '';
    const total = clientesConAccesos().length;
    const lista = clientesFiltrados();
    $('panelAdmin').innerHTML = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap">
          <div class="card-title" style="margin:0">Clientes (<span id="cliCount">${lista.length}</span> de ${total})</div>
          ${toggleVistaHTML()}
        </div>
        <input type="text" id="qAdmin" value="${qEsc}" oninput="aplicarFiltroAdmin()" placeholder="🔎 Buscar cliente por nombre o mail…" style="margin-bottom:12px">
        <p class="muted" style="font-size:12px;margin:0">Cuántas veces entró cada inversor a su portal y cuándo fue la última vez.</p>
      </div>
      <div class="card">
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Cliente</th><th>Email</th><th>Inversiones</th><th>Accesos</th><th>Último acceso</th></tr></thead>
            <tbody id="cliBody">${filasClientes(lista)}</tbody>
          </table>
        </div>
      </div>
      ${cardHuerfanos}`;
    return;
  }
  if (_vistaAdmin === 'propiedad') {
    const total = propGroups().length;
    const gF = propGroupsFiltradas();
    $('panelAdmin').innerHTML = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap">
          <div class="card-title" style="margin:0">Propiedades (<span id="propCount">${gF.length}</span> de ${total})</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">${toggleVistaHTML()}<button class="btn btn-primary btn-sm" onclick="abrirNueva()">+ Nueva inversión</button></div>
        </div>
        <input type="text" id="qAdmin" value="${qEsc}" oninput="aplicarFiltroAdmin()" placeholder="🔎 Buscar por propiedad, nombre, mail…" style="margin-bottom:12px">
        <p class="muted" style="font-size:12px;margin:0">Actualizá el valor de una propiedad una sola vez y se recalcula la parte de cada propietario según su %.</p>
      </div>
      <div id="propWrap">${tarjetasPropiedad(gF)}</div>`;
    return;
  }
  const listaInv = listaInversorAdmin();
  $('panelAdmin').innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap">
        <div class="card-title" style="margin:0">Inversiones cargadas (<span id="admCount">${listaInv.length}</span> de ${_inversiones.length})</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">${toggleVistaHTML()}<button class="btn btn-primary btn-sm" onclick="abrirNueva()">+ Nueva inversión</button></div>
      </div>
      <input type="text" id="qAdmin" value="${qEsc}" oninput="aplicarFiltroAdmin()" placeholder="🔎 Buscar por nombre, dirección, mail…" style="margin-bottom:14px">
      <p class="muted" style="font-size:11px;margin:-6px 0 12px">Tocá un título de columna para ordenar (▲ menor a mayor · ▼ mayor a menor).</p>
      <div class="tbl-wrap">
        <table>
          <thead>${theadAdmin()}</thead>
          <tbody id="admBody">${filasAdmin(listaInv)}</tbody>
        </table>
      </div>
    </div>`;
}

// ── Vista "por propiedad": agrupa los inversores de una misma unidad ──
function propGroups() {
  const map = new Map();
  _inversiones.forEach(inv => { if (!map.has(inv.propiedad)) map.set(inv.propiedad, []); map.get(inv.propiedad).push(inv); });
  return [...map.entries()].map(([prop, rows]) => ({ prop, rows })).sort((a, b) => a.prop.localeCompare(b.prop));
}

function propGroupsFiltradas() {
  const toks = normTxt(_qAdmin).split(/\s+/).filter(Boolean);
  if (!toks.length) return propGroups();
  return propGroups().filter(g => {
    const hay = normTxt([g.prop, ...g.rows.map(r => (r.inversor_nombre || '') + ' ' + (r.inversor_email || ''))].join(' '));
    return toks.every(t => hay.includes(t));
  });
}

function tarjetasPropiedad(groups) {
  groups = groups || propGroups();
  if (!groups.length) return `<div class="card"><div class="empty">${_qAdmin ? 'No hay propiedades para “' + _qAdmin + '”.' : 'Todavía no hay propiedades.'}</div></div>`;
  return groups.map(({ prop, rows }) => {
    const ref = rows[0];
    const est = estadoDe(ref);
    const sumaTit = rows.reduce((s, r) => s + (r.titularidad == null || r.titularidad === '' ? 100 : Number(r.titularidad)), 0);

}

// Lista de valores por fecha a nivel PROPIEDAD (real o proyectado), se aplica a todos los dueños
function _listaValProp(prop, proyectado) {
  const pe = prop.replace(/'/g, "\\'");
  const ids = _inversiones.filter(i => i.propiedad === prop).map(r => r.id);
  const byDate = new Map();
  _valuaciones.filter(x => ids.includes(x.inversion_id) && (!!x.proyectado === !!proyectado)).forEach(x => { if (!byDate.has(x.fecha)) byDate.set(x.fecha, Number(x.valor)); });
  const fechas = [...byDate.entries()].sort((a, b) => new Date(a[0]) - new Date(b[0]));
  return fechas.map(([f, v]) => `<div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--bd)">
      <span>${fmtFecha(f)} — <b>${fmtUSD(v)}</b> <span class="muted">total</span></span>
      <button class="btn btn-danger btn-sm" onclick="delValuacionProp('${pe}','${f}',${proyectado ? 'true' : 'false'})">×</button>
    </div>`).join('');
}

// Historial de valor REAL por fecha
function renderHistProp(prop) {
  const cont = $('histProp'); if (!cont) return;
  const pe = prop.replace(/'/g, "\\'");

// Proyección a FUTURO (línea punteada gris)
function renderProyProp(prop) {

async function addValuacionProp(prop, proyectado) {
  const fIn = proyectado ? 'pyFecha' : 'pvFecha', vIn = proyectado ? 'pyValor' : 'pvValor';
  const fecha = $(fIn).value;
  const valor = $(vIn).value.trim();
  if (!fecha || valor === '') { alert('Poné fecha y valor.'); return; }
  const rows = _inversiones.filter(i => i.propiedad === prop);
  const ids = rows.map(r => r.id);
  // Borro esa fecha (del mismo tipo) en TODOS los dueños para que quede pareja y sin duplicados
  await supa.from('valuaciones').delete().in('inversion_id', ids).eq('fecha', fecha).eq('proyectado', !!proyectado);
  const payload = rows.map(r => ({ inversion_id: r.id, fecha, valor: Number(valor), proyectado: !!proyectado }));
  const { data, error } = await supa.from('valuaciones').insert(payload).select();
  if (error) { alert('No se pudo agregar: ' + (error.message || '')); console.error(error); return; }
  if (!data || !data.length) { alert('Se guardó, pero no puedo leerla de vuelta (faltan permisos de LECTURA en "valuaciones"). Corré el SQL que te pasé.'); }
  $(fIn).value = ''; $(vIn).value = '';
  await cargarValuaciones();
  if (proyectado) renderProyProp(prop); else renderHistProp(prop);
}

async function delValuacionProp(prop, fecha, proyectado) {
  const ids = _inversiones.filter(i => i.propiedad === prop).map(r => r.id);
  const { error } = await supa.from('valuaciones').delete().in('inversion_id', ids).eq('fecha', fecha).eq('proyectado', !!proyectado);
  if (error) { alert('No se pudo borrar.'); console.error(error); return; }
  await cargarValuaciones();
  if (proyectado) renderProyProp(prop); else renderHistProp(prop);
}

function prevProp(prop) {
  const rows = _inversiones.filter(i => i.propiedad === prop);
  const merc = parseFloat($('pMercado').value);
  const vent = parseFloat($('pVenta').value);
  const ref = !isNaN(vent) ? vent : merc;
  rows.forEach(r => {
    const c = (r.titularidad == null || r.titularidad === '' ? 100 : Number(r.titularidad)) / 100;
    const el = document.getElementById('pvShare_' + r.id);
    if (el) el.textContent = isNaN(ref) ? '—' : fmtUSD(ref * c);
  });
}

async function guardarPropiedad(prop) {
  const num = (id) => { const x = $(id).value.trim(); return x === '' ? null : Number(x); };
  const datos = { precio_mercado: num('pMercado'), precio_venta: num('pVenta'), fecha_venta: $('pVentaFecha').value || null, condicion: $('pCondicion').value || 'A' };

  appAlert('✓ Propiedad actualizada', 'ok');
}

let _ownerSeq = 0;

// Clientes ya cargados (para elegirlos con el mail ya relacionado). Se derivan de las inversiones.
function clientesActivos() {
  const map = new Map();
  _inversiones.forEach(i => {

    if (!map.has(k)) map.set(k, { nombre: i.inversor_nombre || '', email });

  return [...map.values()].sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
}

async function guardarNueva() {
  const propiedad = $('nProp').value.trim();
  clearErr('nErr');
  if (!propiedad) { showErr('nErr', 'Poné la propiedad.'); return; }
  const num = (id) => { const x = $(id).value.trim(); return x === '' ? null : Number(x); };
  const base = {
    propiedad,
    fecha: $('nFecha').value || null,
    pagado: num('nPagado'),
    tc: num('nTC'),
    precio_mercado: num('nMercado'),
    precio_venta: num('nVenta'),
    fecha_venta: $('nVentaFecha').value || null,
    condicion: $('nCondicion').value || 'A'
  };
  const rows = [...document.querySelectorAll('#owners .owner-row')];
  const owners = [];
  for (const r of rows) {
    const nombre = r.querySelector('.oNombre').value.trim();
    const email = r.querySelector('.oEmail').value.trim();
    const pct = r.querySelector('.oPct').value.trim();
    if (!nombre && !email && pct === '') continue;
    if (!nombre || !email) { showErr('nErr', 'Cada propietario necesita nombre y email.'); return; }
    owners.push({ ...base, inversor_nombre: nombre, inversor_email: email, titularidad: pct === '' ? 100 : Number(pct) });
  }
  if (!owners.length) { showErr('nErr', 'Agregá al menos un propietario.'); return; }
  const { error } = await supa.from('inversiones').insert(owners);
  if (error) { showErr('nErr', 'No se pudo guardar: ' + (error.message || '')); console.error(error); return; }
  const m = document.getElementById('modalNueva'); if (m) m.remove();
  await cargarAdmin();
  appAlert('✓ Inversión cargada (' + owners.length + ' propietario' + (owners.length > 1 ? 's' : '') + ')', 'ok');
}

// Vista previa: muestra la parte que le corresponde al inversor según su titularidad
function prevParte() {
  if (!$('fTit')) return;
  const tit = parseFloat($('fTit').value) || 100;
  const c = tit / 100;
  const pag = parseFloat($('fPagado').value);
  const merc = parseFloat($('fMercado').value);
  const vent = parseFloat($('fVenta').value);
  const ref = !isNaN(vent) ? vent : merc;
  let txt = '';
  if (!isNaN(pag)) {
    txt = `Parte del inversor (${tit}%): pagó ${fmtUSD(pag * c)}`;
    if (!isNaN(ref)) {
      const res = (ref - pag) * c;
      txt += ` · ${!isNaN(vent) ? 'vendió en' : 'vale'} ${fmtUSD(ref * c)} · resultado ${res >= 0 ? '+' : ''}${fmtUSD(res)} (${fmtPct((ref - pag) / pag * 100)})`;
    }
  }
  $('fPreview').textContent = txt;
}

const numOrNull = (id) => { const x = $(id).value.trim(); return x === '' ? null : Number(x); };

async function guardar(id) {
  const nombre = $('fNombre').value.trim();
  const email = $('fEmail').value.trim();
  const propiedad = $('fProp').value.trim();
  clearErr('fErr');
  if (!nombre || !email || !propiedad) { showErr('fErr', 'Completá nombre, email y propiedad.'); return; }
  const datos = {
    inversor_nombre: nombre,
    inversor_email: email,
    propiedad,
    titularidad: numOrNull('fTit'),
    fecha: $('fFecha').value || null,
    pagado: numOrNull('fPagado'),
    tc: numOrNull('fTC'),
    precio_mercado: numOrNull('fMercado'),
    precio_venta: numOrNull('fVenta'),
    fecha_venta: $('fVentaFecha').value || null,
    condicion: $('fCondicion').value || 'A'
  };
  const q = id ? supa.from('inversiones').update(datos).eq('id', id) : supa.from('inversiones').insert(datos);
  const { error } = await q;
  if (error) { showErr('fErr', 'No se pudo guardar: ' + (error.message || '')); console.error(error); return; }
  $('modalInv').remove();
  await cargarAdmin();
  appAlert('✓ Inversión guardada', 'ok');
}

async function borrar(id) {
  if (!confirm('¿Borrar esta inversión? No se puede deshacer.')) return;
  const { error } = await supa.from('inversiones').delete().eq('id', id);
  if (error) { appAlert('No se pudo borrar.', 'error'); console.error(error); return; }
  await cargarAdmin();
  appAlert('Inversión borrada', 'ok');
}

let _invsInversor = [];

// El admin ve el dashboard tal cual lo ve un inversor (el banner lo agrega renderDashboard)
function verComoInversor(email, nombre) {
  const invs = _inversiones.filter(i => (i.inversor_email || '').toLowerCase() === (email || '').toLowerCase());
  $('panelAdmin').classList.add('oculto');
  $('dashInversor').classList.remove('oculto');
  document.body.classList.remove('wide');
  renderDashboard(invs);
  window.scrollTo(0, 0);
}
function volverPanel() {
  $('dashInversor').classList.add('oculto');
  $('panelAdmin').classList.remove('oculto');
  document.body.classList.add('wide');
  $('saludo').textContent = 'Panel de administración';
}

// Panel de detalle de UNA inversión (gráfico + info completa)
function verDetalleInversion(id) {
  const inv = _invsInversor.find(i => i.id === id);
  if (!inv) return;
  const est = estadoDe(inv);
  const res = resultadoDe(inv);
  const dias = diasDe(inv);
  const pts = timelinePropiedad(inv);
  const proy = timelineProyeccion(inv);
  const proyFin = proy.length ? proy[proy.length - 1] : null;
  const vals = _valuaciones.filter(x => x.inversion_id === id && !x.proyectado).sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
  const histRows = vals.length ? vals.map(x => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--bd)"><span>${fmtFecha(x.fecha)}</span><b>${fmtUSD(Number(x.valor) * cuota(inv))}</b></div>`).join('') : '';
  $('dashInversor').innerHTML = `
    <button class="btn btn-sec btn-sm" style="margin-bottom:14px" onclick="volverDashboard()">← Volver</button>
    <div class="card">
      <div class="prop-head" style="margin-bottom:16px">
        <div class="prop-name" style="font-size:18px">${inv.propiedad}</div>
        <span class="tag ${est === 'vendida' ? 'tag-sold' : 'tag-hold'}">${est === 'vendida' ? 'Vendida' : 'En cartera'}</span>
      </div>
      <div class="prop-grid">
        <div><span>Titularidad</span><b>${inv.titularidad != null ? inv.titularidad + '%' : '—'}</b></div>
        <div><span>Fecha de compra</span><b>${fmtFecha(inv.fecha)}</b></div>
        ${est === 'vendida' ? `<div><span>Fecha de venta</span><b>${fmtFecha(inv.fecha_venta)}</b></div>` : ''}
        <div><span>Pagaste</span><b>${fmtUSD(pagadoInv(inv))}</b></div>
        <div><span>${est === 'vendida' ? 'Vendida en' : 'Vale hoy'} (tu parte)</span><b>${fmtUSD(valorInv(inv))}</b></div>
        <div><span>Resultado</span><b class="${res >= 0 ? 'green' : ''}">${res == null ? '—' : (res >= 0 ? '+' : '') + fmtUSD(res)}</b></div>
        <div><span>Ganancia</span><b class="${(pctDe(inv) || 0) >= 0 ? 'green' : ''}">${fmtPct(pctDe(inv))}</b></div>
        ${cuota(inv) < 1 && refTotal(inv) != null ? `<div><span>Valor total propiedad</span><b>${fmtUSD(refTotal(inv))}</b></div>` : ''}
        <div><span>${est === 'vendida' ? 'Tiempo hasta la venta' : 'Tiempo'}</span><b>${dias != null ? dias + ' días' : '—'}</b></div>
        <div><span>Condición</span><b>${condTag(inv.condicion)} ${(inv.condicion === 'B') ? 'No declarada' : 'Declarada'}</b></div>
      </div>
      ${inv.tc ? `<div class="prop-foot">TC al comprar: ${Number(inv.tc).toLocaleString('es-AR')}</div>` : ''}
    </div>
    <div class="card">
      <div class="card-title">📈 Evolución del valor (tu parte)</div>
      ${chartHTML(pts, { proj: proy })}
      ${proyFin ? `<p class="muted" style="font-size:11px;margin:8px 0 0"><span style="color:#9ca3af">- - -</span> Proyección · a <b>${fmtFecha(proyFin.t.toISOString().slice(0, 10))}</b> estimado en <b>${fmtUSD(proyFin.v)}</b> (tu parte)</p>` : ''}
    </div>
    ${histRows ? `<div class="card"><div class="card-title">Historial de valuaciones (tu parte)</div>${histRows}</div>` : ''}`;
  flushCharts();
  window.scrollTo(0, 0);
}
function volverDashboard() {
  renderDashboard(_invsInversor);
  window.scrollTo(0, 0);
}

// ── Restaurar sesión al recargar ──
(async function init() {
  const { data: { session } } = await supa.auth.getSession();
  if (session && session.user) {
    usuario = { email: session.user.email, rol: esAdmin(session.user.email) ? 'admin' : 'inversor' };
    entrar();
  }
})();
</script>
